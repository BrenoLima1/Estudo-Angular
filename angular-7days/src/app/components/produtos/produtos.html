<ul>
  @for (produto of produtos(); track produto.id) {
    <li>
      {{ produto.nome }}
      <button (click)="produtoSelecionado.emit(produto.nome)">
        Selecionar
      </button>

      <button (click)="irParaDetalhes(produto.id)">
        Ver detalhes
      </button>

      <button (click)="remover(produto.id)">
        Remover
      </button>

      @if (mostrarPrecos()) {
        <p>Preço: {{ produto.preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</p>
      }
    </li>

  } @empty {
    <li>Nenhum produto cadastrado.</li>
  }
</ul>

<button (click)="adicionar()">
  Adicionar Headset
</button>

<p>Quantidade de produtos: {{ quantidadeProdutos() }}</p>
